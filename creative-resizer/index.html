<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Resizer | Free Pattern Resizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-start: #d6cfc0;
    --bg-end: #cdc6b6;
    --panel: #ebe6dc;
    --card: #f5f1e9;
    --input: #f9f6f0;
    --border: #7d7362;
    --border-soft: #b3aa97;
    --text: #1f2326;
    --text-dim: #34383b;
    --teal: #0f6b66;
    --teal-dark: #0b5753;
    --secondary: #ddd6c8;
    --secondary-hover: #cfc7b6;
    --stage: #d3ccbd;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font-ui);
    font-size: 15px;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
    min-height: 100vh;
    padding: 24px 16px 48px;
    -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 640px; margin: 0 auto; }
header { text-align: center; margin-bottom: 22px; }
h1 { font-family: 'Caveat', cursive; font-size: 56px; font-weight: 700; line-height: 1.05; }
.subtitle { margin-top: 6px; font-size: 17px; font-weight: 500; color: var(--text-dim); }
.panel {
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 28px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.card { background: var(--card); border: 1px solid var(--border-soft); border-radius: 22px; padding: 16px; }
.card .label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.hint { font-size: 13px; line-height: 1.45; color: var(--text-dim); margin-top: 8px; }
.upload { border: 2px dashed var(--border); border-radius: 22px; background: var(--card); padding: 28px 16px; text-align: center; cursor: pointer; }
.upload.drag { border-color: var(--teal); background: #d0e2dd; }
.upload .title { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
.upload .sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
button, input { font-family: inherit; }
button {
    background: var(--teal);
    color: #fff;
    border: 1px solid var(--teal-dark);
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.01em;
    padding: 11px 22px;
    min-height: 44px;
    cursor: pointer;
}
button:hover:not(:disabled) { background: var(--teal-dark); }
button:active:not(:disabled) { transform: scale(0.98); }
button:disabled { background: #cfc8b9; border-color: var(--border-soft); color: #5c574e; cursor: not-allowed; }
button.secondary { background: var(--secondary); color: var(--text); border-color: var(--border); }
button.secondary:hover:not(:disabled) { background: var(--secondary-hover); }
button:focus-visible, input:focus-visible, .upload:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; font-size: 14px; }
.seg button:not(.active) { background: var(--secondary); color: var(--text); border-color: var(--border); }
.seg button:not(.active):hover { background: var(--secondary-hover); }
.dims { display: flex; gap: 10px; align-items: flex-end; margin-top: 14px; }
.dims .field { flex: 1; min-width: 0; }
.dims .times { flex: 0 0 auto; font-weight: 600; font-size: 18px; padding-bottom: 10px; }
.dims label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.dims input[type="number"] {
    width: 100%;
    background: var(--input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 16px;
    padding: 12px 16px;
    min-height: 44px;
}
.row-between { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; cursor: pointer; margin: 4px 0; }
input[type="range"]::-webkit-slider-runnable-track { box-sizing: border-box; height: 10px; border-radius: 999px; background: #aaa190; border: 1px solid #6f6657; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; box-sizing: border-box; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%; background: var(--teal); border: 3px solid #f9f6f0; box-shadow: 0 0 0 1px #0b4a46; }
input[type="range"]::-moz-range-track { box-sizing: border-box; height: 10px; border-radius: 999px; background: #aaa190; border: 1px solid #6f6657; }
input[type="range"]::-moz-range-thumb { box-sizing: border-box; width: 26px; height: 26px; border-radius: 50%; background: var(--teal); border: 3px solid #f9f6f0; box-shadow: 0 0 0 1px #0b4a46; }
input[type="range"]:disabled { opacity: 0.5; cursor: not-allowed; }
.hidden { display: none !important; }
.stage { background: var(--stage); border: 1px solid var(--border-soft); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
canvas#preview { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
.stage .info { font-size: 14px; font-weight: 500; text-align: center; }
.stage .empty { padding: 40px 0; color: var(--text-dim); font-size: 15px; text-align: center; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .download { flex: 1 1 220px; font-size: 16px; padding: 12px 24px; }
.note { font-size: 13px; color: var(--text-dim); text-align: center; line-height: 1.5; }
@media (max-width: 520px) { h1 { font-size: 44px; } .panel { padding: 14px; border-radius: 22px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
    <h1>✿ Creative Resizer ✿</h1>
    <div class="subtitle">Tile your pattern to any size. Download it.</div>
</header>

<main class="panel">
    <div class="upload" id="upload" tabindex="0" role="button" aria-label="Choose your pattern">
        <div class="title" id="uploadTitle">drop your pattern here, or tap to choose</div>
        <div class="sub" id="uploadSub">PNG, JPG or WEBP</div>
    </div>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>

    <div class="card">
        <div class="label">Size</div>
        <div class="seg" id="unitSeg">
            <button type="button" class="active" data-unit="in">inches (300 DPI)</button>
            <button type="button" data-unit="px">pixels</button>
        </div>
        <div class="dims">
            <div class="field"><label for="w">Width</label><input type="number" id="w" min="0.1" step="0.01" inputmode="decimal" value="12"></div>
            <div class="times">×</div>
            <div class="field"><label for="h">Height</label><input type="number" id="h" min="0.1" step="0.01" inputmode="decimal" value="12"></div>
        </div>
        <div class="hint" id="sizeHint"></div>
    </div>

    <div class="card">
        <div class="row-between"><label for="scale">Pattern size</label><span id="scaleLabel">3 repeats across</span></div>
        <input type="range" id="scale" min="1" max="10" step="0.5" value="3" disabled>
        <div class="hint">Fewer repeats = bigger motifs. More repeats = smaller motifs.</div>
    </div>

    <div class="stage">
        <canvas id="preview" class="hidden"></canvas>
        <div class="empty" id="empty">your preview will appear here</div>
        <div class="info" id="info"></div>
    </div>

    <div class="actions">
        <button type="button" class="download" id="download" disabled>⬇ download PNG</button>
        <button type="button" class="secondary" id="replace" disabled>choose another pattern</button>
    </div>
    <div class="note" id="note">Your pattern stays on your device. Nothing is uploaded.</div>
</main>
</div>

<script>
(function () {
    var DPI = 300;
    var MAX_PIXELS = 16000000; // iPad Safari canvas limit is ~16.7M pixels
    var $ = function (id) { return document.getElementById(id); };
    var upload = $('upload'), fileInput = $('file'), wIn = $('w'), hIn = $('h'), scale = $('scale'), scaleLabel = $('scaleLabel');
    var preview = $('preview'), empty = $('empty'), info = $('info'), sizeHint = $('sizeHint');
    var downloadBtn = $('download'), replaceBtn = $('replace'), note = $('note');
    var img = null, fileBase = 'creative_resizer', unit = 'in';

    function toUnit(px) { return unit === 'px' ? Math.round(px) : Math.round(px / DPI * 100) / 100; }
    function toPx(v) { return Math.round(unit === 'px' ? v : v * DPI); }

    function getTarget() {
        var w = toPx(parseFloat(wIn.value)), h = toPx(parseFloat(hIn.value));
        if (!(w >= 1) || !(h >= 1)) return null;
        var reduced = false;
        if (w * h > MAX_PIXELS) {
            var f = Math.sqrt(MAX_PIXELS / (w * h));
            w = Math.max(1, Math.floor(w * f)); h = Math.max(1, Math.floor(h * f)); reduced = true;
        }
        return { w: w, h: h, reduced: reduced };
    }

    // One routine draws the tiled pattern at any size, so the preview and the
    // downloaded file show the same repeat count and placement.
    function render(ctx, W, H) {
        ctx.clearRect(0, 0, W, H);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        var across = parseFloat(scale.value) || 3;
        var tw = W / across;
        var th = tw * (img.naturalHeight / img.naturalWidth);
        var cols = Math.ceil(across) + 1, rows = Math.ceil(H / th) + 1;
        for (var r = 0; r < rows; r++) {
            var y0 = Math.round(r * th), y1 = Math.round((r + 1) * th);
            if (y0 >= H) break;
            for (var c = 0; c < cols; c++) {
                var x0 = Math.round(c * tw), x1 = Math.round((c + 1) * tw);
                if (x0 >= W) break;
                ctx.drawImage(img, x0, y0, x1 - x0, y1 - y0);
            }
        }
    }

    function refresh() {
        var n = parseFloat(scale.value);
        scaleLabel.textContent = (n === 1 ? '1 repeat' : n + ' repeats') + ' across';
        var t = getTarget();
        if (!t) { sizeHint.textContent = 'Enter a width and height.'; downloadBtn.disabled = true; return; }
        sizeHint.textContent = t.w + ' × ' + t.h + ' px' + (unit === 'in' ? ' at ' + DPI + ' DPI' : '');
        note.textContent = t.reduced
            ? 'That size is larger than your device can export, so it will be saved a little smaller.'
            : 'Your pattern stays on your device. Nothing is uploaded.';
        if (!img) return;
        var k = Math.min(1, 560 / Math.max(t.w, t.h));
        preview.width = Math.max(1, Math.round(t.w * k));
        preview.height = Math.max(1, Math.round(t.h * k));
        render(preview.getContext('2d'), preview.width, preview.height);
        preview.classList.remove('hidden');
        empty.classList.add('hidden');
        info.textContent = t.w + ' × ' + t.h + ' px';
        downloadBtn.disabled = false;
    }

    function setUnit(u) {
        var cw = parseFloat(wIn.value), ch = parseFloat(hIn.value);
        var pw = cw > 0 ? toPx(cw) : null, ph = ch > 0 ? toPx(ch) : null;
        unit = u;
        document.querySelectorAll('#unitSeg button').forEach(function (b) { b.classList.toggle('active', b.dataset.unit === u); });
        if (pw) wIn.value = String(toUnit(pw));
        if (ph) hIn.value = String(toUnit(ph));
        wIn.step = hIn.step = u === 'px' ? '1' : '0.01';
        refresh();
    }

    function loadFile(file) {
        if (!file || !/^image\/(png|jpe?g|webp)$/.test(file.type)) {
            $('uploadSub').textContent = 'Please choose a PNG, JPG or WEBP image.';
            return;
        }
        var im = new Image();
        im.onload = function () {
            img = im;
            fileBase = (file.name.replace(/\.[^.]+$/, '') || 'creative_resizer').replace(/[^a-z0-9_-]+/gi, '_');
            $('uploadTitle').textContent = file.name;
            $('uploadSub').textContent = im.naturalWidth + ' × ' + im.naturalHeight + ' px · tap to change';
            scale.disabled = false;
            replaceBtn.disabled = false;
            refresh();
        };
        im.onerror = function () { $('uploadSub').textContent = 'That image could not be read. Try another file.'; };
        im.src = URL.createObjectURL(file);
    }

    function download() {
        var t = getTarget();
        if (!img || !t) return;
        var cv = document.createElement('canvas');
        cv.width = t.w; cv.height = t.h;
        render(cv.getContext('2d'), t.w, t.h);
        cv.toBlob(function (blob) {
            if (!blob) { note.textContent = 'Could not create the file. Try a smaller size.'; return; }
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileBase + '_' + t.w + 'x' + t.h + '.png';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        }, 'image/png');
    }

    upload.addEventListener('click', function () { fileInput.click(); });
    upload.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    ['dragenter', 'dragover'].forEach(function (t) { upload.addEventListener(t, function (e) { e.preventDefault(); upload.classList.add('drag'); }); });
    ['dragleave', 'drop'].forEach(function (t) { upload.addEventListener(t, function (e) { e.preventDefault(); upload.classList.remove('drag'); }); });
    upload.addEventListener('drop', function (e) { loadFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', function () { loadFile(fileInput.files[0]); fileInput.value = ''; });
    replaceBtn.addEventListener('click', function () { fileInput.click(); });
    downloadBtn.addEventListener('click', download);
    [wIn, hIn, scale].forEach(function (el) { el.addEventListener('input', refresh); });
    document.querySelectorAll('#unitSeg button').forEach(function (b) { b.addEventListener('click', function () { setUnit(b.dataset.unit); }); });
    refresh();
})();
</script>
</body>
</html>
